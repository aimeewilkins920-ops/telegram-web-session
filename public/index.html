<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telegram Session Generator</title>
  <style>
    body { font-family: sans-serif; padding: 50px; background: #f5f5f5; }
    input, button { padding: 10px; margin: 5px 0; width: 300px; }
    #result { margin-top: 20px; background: #fff; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Telegram Session Generator</h1>
  <input type="text" id="phone" placeholder="Enter phone number" /><br>
  <input type="text" id="code" placeholder="Enter OTP code" /><br>
  <input type="text" id="password" placeholder="2FA password (optional)" /><br>
  <button id="generate">Generate Session</button>

  <div id="result"></div>

  <script>
    document.getElementById("generate").onclick = async () => {
      const phone = document.getElementById("phone").value;
      const code = document.getElementById("code").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/generate-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, code, password })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById("result").innerText = "✅ Your session string:\n" + data.session;
      } else {
        document.getElementById("result").innerText = "❌ Error: " + data.error;
      }
    };
  </script>
</body>
</html>
